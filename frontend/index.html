<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Tracker & Live Support</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  body { font-family: Arial; max-width: 600px; margin: 30px auto; }
  #chatBox { border: 1px solid #ccc; height: 200px; overflow-y: auto; padding: 10px; margin: 10px 0; }
  input, button { padding: 8px; margin: 4px 0; }
  input { width: 70%; }
</style>
</head>
<body>

<h2>Real-Time Order Tracker & Live Support</h2>

<h3>1. Join as</h3>
<input id="nameInput" placeholder="Your name" />
<select id="roleSelect">
  <option value="customer">Customer</option>
  <option value="agent">Support Agent</option>
</select>
<button onclick="joinChat()">Join</button>

<h3>2. Chat Room</h3>
<input id="roomInput" placeholder="Room ID (e.g. room1)" value="room1" />
<button onclick="joinRoom()">Join Room</button>
<div id="chatBox"></div>
<input id="msgInput" placeholder="Type message..." />
<button onclick="sendMessage()">Send</button>

<h3>3. Order Status (live updates)</h3>
<div id="orderUpdates"></div>

<script>
  const socket = io('http://localhost:5000');
  let currentRoom = '';
  let myName = '';

  function joinChat() {
    myName = document.getElementById('nameInput').value || 'Anonymous';
    const role = document.getElementById('roleSelect').value;
    socket.emit('join', { role, name: myName });
    alert(`Joined as ${role}: ${myName}`);
  }

  function joinRoom() {
    currentRoom = document.getElementById('roomInput').value;
    socket.emit('joinRoom', currentRoom);
  }

  function sendMessage() {
    const message = document.getElementById('msgInput').value;
    if (!message || !currentRoom) return;
    socket.emit('sendMessage', { roomId: currentRoom, message, sender: myName });
    document.getElementById('msgInput').value = '';
  }

  socket.on('receiveMessage', (data) => {
    const chatBox = document.getElementById('chatBox');
    chatBox.innerHTML += `<p><b>${data.sender}:</b> ${data.message}</p>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  socket.on('orderStatusUpdated', (order) => {
    const div = document.getElementById('orderUpdates');
    div.innerHTML = `<p>Order ${order.id} status: <b>${order.status}</b></p>` + div.innerHTML;
  });
</script>

</body>
</html>
